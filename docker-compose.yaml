services:
  api:
    build: .
    image: retro-service:latest
    container_name: retro-service
    restart: unless-stopped

    ports:
      - "7777:8000"

    environment:
      APP_NAME: retro-service
      APP_VERSION: "1.0.0"

      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "20"

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXP_MINS: "15"
      REFRESH_TOKEN_EXP_DAYS: "30"
      ALGORITHM: HS256

      LOG_LEVEL: info
      LOG_FORMAT: json
      SQLALCHEMY_LOG: "false"
      ENVIRONMENT: production

      OTLP_ENDPOINT: ${OTLP_ENDPOINT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

      MUSIC_DIR: /code/music
      COVERS_DIR: /code/covers

    volumes:
      - ${MUSIC_HOST_DIR}:/code/music:ro
      - ${COVERS_HOST_DIR}:/code/covers

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
